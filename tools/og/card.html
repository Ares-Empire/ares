<!doctype html>
<!-- The link preview picture (tools/og-card.mjs fills the {{placeholders}} and takes the picture): 1200×630 in the
     site's dark look (site.css: its wall, its red light from the top and blue from the bottom right, the line of light
     in its colours). The name on two lines and the short lines under it stay inside the middle square (630×630), so a
     small square preview (WhatsApp and others crop the middle) still shows all of it, as large as fits. -->
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Space Grotesk";
    src: url("/assets/fonts/SpaceGrotesk-Variable.ttf") format("truetype");
    font-weight: 300 700;
  }
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden; position: relative;
    background:
      radial-gradient(72% 60% at 50% -14%, rgba(196,48,36,0.30), transparent 62%),
      radial-gradient(58% 56% at 94% 122%, rgba(52,92,170,0.26), transparent 58%),
      #050507;
    font-family: "Space Grotesk", sans-serif; color: #f6f7fb;
    -webkit-font-smoothing: antialiased;
  }
  svg.flow { position: absolute; inset: 0; }
  .card {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding-bottom: 34px; text-align: center;
  }
  h1 { margin: 0; font-size: 138px; font-weight: 600; letter-spacing: -0.04em; line-height: 0.94; }
  h1 span { display: block; }
  .lines { margin: 34px 0 0; font-size: 50px; font-weight: 500; line-height: 1.16; color: #c3c8d3; letter-spacing: -0.015em; }
  .lines span { display: block; }
  .domain {
    position: absolute; left: 0; right: 0; bottom: 40px; text-align: center;
    font-size: 19px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: #848b99;
  }
</style>
</head>
<body>
  <svg class="flow" viewBox="0 0 1200 630" aria-hidden="true">
    <defs>
      <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#7c5cff" stop-opacity="0"/>
        <stop offset="0.25" stop-color="#7c5cff" stop-opacity="0.45"/>
        <stop offset="0.65" stop-color="#d9465a" stop-opacity="0.6"/>
        <stop offset="1" stop-color="#e9c86b" stop-opacity="0.9"/>
      </linearGradient>
      <filter id="soft" x="-10%" y="-50%" width="120%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
      <radialGradient id="head">
        <stop offset="0" stop-color="#fff2c8" stop-opacity="0.95"/>
        <stop offset="0.35" stop-color="#e9c86b" stop-opacity="0.45"/>
        <stop offset="1" stop-color="#e9c86b" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <path d="M -60 590 C 200 640, 420 642, 640 614 S 960 560, 1075 498" fill="none" stroke="url(#flow)" stroke-width="12" opacity="0.35" filter="url(#soft)"/>
    <path d="M -60 590 C 200 640, 420 642, 640 614 S 960 560, 1075 498" fill="none" stroke="url(#flow)" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="1075" cy="498" r="26" fill="url(#head)"/>
  </svg>
  <main class="card">
    <h1>{{nameLines}}</h1>
    <p class="lines">{{lines}}</p>
  </main>
  <p class="domain">{{domain}}</p>
  <script>
    document.fonts.ready.then(() => { document.body.dataset.ready = 'yes'; });
  </script>
</body>
</html>
