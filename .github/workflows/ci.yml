name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  owner-contract:
    name: owner contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13' # the server's Python (3.13.5 on 2026-11-07)
      - name: Check owner contract with invented details
        run: >-
          python3 tools/check-owner.py
          OwnerChecks.test_override_and_default
          OwnerChecks.test_invalid_files
          OwnerChecks.test_unreadable_file
          OwnerChecks.test_legal_escaping
